object CheckCommand "Invoke-IcingaCheckHttpJsonResponse" {
    import "PowerShell Base"

    arguments += {
        "-ServerPath" = {
            set_if = {{
                var str = macro("$IcingaCheckHttpJsonResponse_String_ServerPath$"); if (len(str) == 0) { return false; }; return true;
            }}
            description = "Path for the request, example '/v1/my_endpoint'"
            value = {{
                var str = macro("$IcingaCheckHttpJsonResponse_String_ServerPath$");
                var argLen = len(str);
                if (argLen == 0) {
                    return;
                }
                if (argLen != 0 && str.substr(0,1) == "'" && str.substr(argLen - 1, argLen) == "'") {
                    return str;
                }
                return ("'" + str + "'");
            }}
            order = 3
        }
        "-Verbosity" = {
            description = "Changes the behavior of the plugin output which check states are printed: 0 (default): Only service checks/packages with state not OK will be printed 1: Only services with not OK will be printed including OK checks of affected check packages including Package config 2: Everything will be printed regardless of the check state 3: Identical to Verbose 2, but prints in addition the check package configuration e.g (All must be [OK])"
            value = "$IcingaCheckHttpJsonResponse_Int32_Verbosity$"
            order = 14
        }
        "-StatusOnRequestError" = {
            set_if = {{
                var str = macro("$IcingaCheckHttpJsonResponse_String_StatusOnRequestError$"); if (len(str) == 0) { return false; }; return true;
            }}
            description = "Status to set when the webservice cannot be reached, an error (e.g. 500) is returned or the existing file provided by -FilePath cannot be read, e.g. because of invalid JSON content - default is Unknown See https://icinga.com/docs/icinga-for-windows/latest/plugins/doc/10-Icinga-Plugins/ for description of threshold values"
            value = {{
                var str = macro("$IcingaCheckHttpJsonResponse_String_StatusOnRequestError$");
                var argLen = len(str);
                if (argLen == 0) {
                    return;
                }
                if (argLen != 0 && str.substr(0,1) == "'" && str.substr(argLen - 1, argLen) == "'") {
                    return str;
                }
                return ("'" + str + "'");
            }}
            order = 13
        }
        "-NoPerfData" = {
            set_if = "$IcingaCheckHttpJsonResponse_Switchparameter_NoPerfData$"
            order = 99
        }
        "-Password" = {
            description = "Credentials to use for basic auth"
            value = "(ConvertTo-IcingaSecureString '$IcingaCheckHttpJsonResponse_Securestring_Password$')"
            order = 7
        }
        "-Username" = {
            set_if = {{
                var str = macro("$IcingaCheckHttpJsonResponse_String_Username$"); if (len(str) == 0) { return false; }; return true;
            }}
            description = "Credentials to use for basic auth"
            value = {{
                var str = macro("$IcingaCheckHttpJsonResponse_String_Username$");
                var argLen = len(str);
                if (argLen == 0) {
                    return;
                }
                if (argLen != 0 && str.substr(0,1) == "'" && str.substr(argLen - 1, argLen) == "'") {
                    return str;
                }
                return ("'" + str + "'");
            }}
            order = 6
        }
        "-ValuePaths" = {
            description = "Values to read from the JSON object in the format `Variable:JsonField`. The variable is the name used by the plugin to reference the value within -ValueTypes, -Warning and -Critical and inside the plugin output, the JSON field is the path of the value inside the JSON object. Nested fields are separated by a dot. Example: 'VariableState:StateField','VariableItems:nested.object.ItemsField'"
            value = {{
                var arr = macro("$IcingaCheckHttpJsonResponse_Array_ValuePaths$");
                if (len(arr) == 0) {
                    return "@()";
                }
                var psarr = arr.map(
                    x => if (typeof(x) == String) {
                        var argLen = len(x);
                        if (argLen != 0 && x.substr(0,1) == "'" && x.substr(argLen - 1, argLen) == "'") {
                            x;
                        } else {
                            "'" + x + "'";
                        }
                    } else {
                        x;
                    }
                ).join(",");
                return "@(" + psarr + ")";
            }}
            order = 9
        }
        "-ValueTypes" = {
            description = "Value types of each variable in the format `Variable:Type`. Supported Types: Numeric, Boolean, DateTime, String, Info, PerfData Info: The value is printed as information without thresholds and does not change the plugin state. Information is shown with -Verbosity 1 in case the plugin is not OK and always with -Verbosity 2 PerfData: The value is forwarded as performance data string, e.g. ''cpu-usage'=5.6%;80;90;0;100'. Single and double quotes are removed and spaces inside labels are replaced by _, resulting in cpu-usage=5.6%;80;90;0;100 Example: 'VariableState:Numeric','VariableTime:DateTime','VariableMessage:Info','VariablePerfData:PerfData'"
            value = {{
                var arr = macro("$IcingaCheckHttpJsonResponse_Array_ValueTypes$");
                if (len(arr) == 0) {
                    return "@()";
                }
                var psarr = arr.map(
                    x => if (typeof(x) == String) {
                        var argLen = len(x);
                        if (argLen != 0 && x.substr(0,1) == "'" && x.substr(argLen - 1, argLen) == "'") {
                            x;
                        } else {
                            "'" + x + "'";
                        }
                    } else {
                        x;
                    }
                ).join(",");
                return "@(" + psarr + ")";
            }}
            order = 10
        }
        "-ThresholdInterval" = {
            set_if = {{
                var str = macro("$IcingaCheckHttpJsonResponse_String_ThresholdInterval$"); if (len(str) == 0) { return false; }; return true;
            }}
            description = "Change the value your defined threshold checks against from the current value to a collected time threshold of the Icinga for Windows daemon, as described here: https://icinga.com/docs/icinga-for-windows/latest/doc/110-Installation/06-Collect-Metrics-over-Time/ An example for this argument would be 1m or 15m which will use the average of 1m or 15m for monitoring."
            value = {{
                var str = macro("$IcingaCheckHttpJsonResponse_String_ThresholdInterval$");
                var argLen = len(str);
                if (argLen == 0) {
                    return;
                }
                if (argLen != 0 && str.substr(0,1) == "'" && str.substr(argLen - 1, argLen) == "'") {
                    return str;
                }
                return ("'" + str + "'");
            }}
            order = 100
        }
        "-ServerUri" = {
            set_if = {{
                var str = macro("$IcingaCheckHttpJsonResponse_String_ServerUri$"); if (len(str) == 0) { return false; }; return true;
            }}
            description = "Base URI of the server, example 'https://example.comm'"
            value = {{
                var str = macro("$IcingaCheckHttpJsonResponse_String_ServerUri$");
                var argLen = len(str);
                if (argLen == 0) {
                    return;
                }
                if (argLen != 0 && str.substr(0,1) == "'" && str.substr(argLen - 1, argLen) == "'") {
                    return str;
                }
                return ("'" + str + "'");
            }}
            order = 2
        }
        "-QueryParameter" = {
            set_if = {{
                var str = macro("$IcingaCheckHttpJsonResponse_String_QueryParameter$"); if (len(str) == 0) { return false; }; return true;
            }}
            description = "Query parameter for the request without ?, example 'command=example'"
            value = {{
                var str = macro("$IcingaCheckHttpJsonResponse_String_QueryParameter$");
                var argLen = len(str);
                if (argLen == 0) {
                    return;
                }
                if (argLen != 0 && str.substr(0,1) == "'" && str.substr(argLen - 1, argLen) == "'") {
                    return str;
                }
                return ("'" + str + "'");
            }}
            order = 4
        }
        "-Critical" = {
            description = "Critical thresholds using icinga-powershell syntax in the format `Variable:Threshold`. Example: 'myNumericAlias01:~:2','myDateTimeAlias:-10d', 'myBooleanAlias:True' String values are compared with -like, supporting wildcards like * and ?. A threshold without wildcards is compared for equality. By default a critical is returned if the value is like the threshold, prefix the threshold with ! to return a critical if the value is not like the threshold. Example: 'myStringAlias:*degraded*', 'myStringAlias:failed', 'myStringAlias:!OK'"
            value = {{
                var arr = macro("$IcingaCheckHttpJsonResponse_Array_Critical$");
                if (len(arr) == 0) {
                    return "@()";
                }
                var psarr = arr.map(
                    x => if (typeof(x) == String) {
                        var argLen = len(x);
                        if (argLen != 0 && x.substr(0,1) == "'" && x.substr(argLen - 1, argLen) == "'") {
                            x;
                        } else {
                            "'" + x + "'";
                        }
                    } else {
                        x;
                    }
                ).join(",");
                return "@(" + psarr + ")";
            }}
            order = 12
        }
        "-IgnoreSSL" = {
            set_if = "$IcingaCheckHttpJsonResponse_Switchparameter_IgnoreSSL$"
            order = 99
        }
        "-Timeout" = {
            description = "Timeout in seconds before the http request is aborted. Defaults to 30. Not used in combination with -FilePath"
            value = "$IcingaCheckHttpJsonResponse_Int32_Timeout$"
            order = 8
        }
        "-Warning" = {
            description = "Warning thresholds using icinga-powershell syntax in the format `Variable:Threshold`. Example: 'myNumericAlias01:~:2','myDateTimeAlias:-10d', 'myBooleanAlias:True' String values are compared with -like, supporting wildcards like * and ?. A threshold without wildcards is compared for equality. By default a warning is returned if the value is like the threshold, prefix the threshold with ! to return a warning if the value is not like the threshold. Example: 'myStringAlias:*degraded*', 'myStringAlias:failed', 'myStringAlias:!OK'"
            value = {{
                var arr = macro("$IcingaCheckHttpJsonResponse_Array_Warning$");
                if (len(arr) == 0) {
                    return "@()";
                }
                var psarr = arr.map(
                    x => if (typeof(x) == String) {
                        var argLen = len(x);
                        if (argLen != 0 && x.substr(0,1) == "'" && x.substr(argLen - 1, argLen) == "'") {
                            x;
                        } else {
                            "'" + x + "'";
                        }
                    } else {
                        x;
                    }
                ).join(",");
                return "@(" + psarr + ")";
            }}
            order = 11
        }
        "-FilePath" = {
            set_if = {{
                var str = macro("$IcingaCheckHttpJsonResponse_String_FilePath$"); if (len(str) == 0) { return false; }; return true;
            }}
            description = "Path to a local or UNC JSON file to read instead of sending a web request, example 'C:\\ProgramData\\monitoring\\mailserver_connect.json' If set, -ServerUri, -ServerPath, -QueryParameter, -Username, -Password, -Timeout and -IgnoreSSL are ignored If the file does not exist, the plugin will throw an exception and return UNKNOWN"
            value = {{
                var str = macro("$IcingaCheckHttpJsonResponse_String_FilePath$");
                var argLen = len(str);
                if (argLen == 0) {
                    return;
                }
                if (argLen != 0 && str.substr(0,1) == "'" && str.substr(argLen - 1, argLen) == "'") {
                    return str;
                }
                return ("'" + str + "'");
            }}
            order = 5
        }
        "-NegateStringResults" = {
            set_if = "$IcingaCheckHttpJsonResponse_Switchparameter_NegateStringResults$"
            order = 99
        }
    }
    vars.IcingaCheckHttpJsonResponse_Switchparameter_NegateStringResults = false
    vars.ifw_api_arguments = {
        "NoPerfData" = {
            set_if = "$IcingaCheckHttpJsonResponse_Switchparameter_NoPerfData$"
        }
        "Timeout" = {
            value = "$IcingaCheckHttpJsonResponse_Int32_Timeout$"
        }
        "Username" = {
            value = "$IcingaCheckHttpJsonResponse_String_Username$"
        }
        "Password" = {
            value = "$IcingaCheckHttpJsonResponse_Securestring_Password$"
        }
        "ValueTypes" = {
            value = "$IcingaCheckHttpJsonResponse_Array_ValueTypes$"
        }
        "ThresholdInterval" = {
            value = "$IcingaCheckHttpJsonResponse_String_ThresholdInterval$"
        }
        "QueryParameter" = {
            value = "$IcingaCheckHttpJsonResponse_String_QueryParameter$"
        }
        "ServerPath" = {
            value = "$IcingaCheckHttpJsonResponse_String_ServerPath$"
        }
        "IgnoreSSL" = {
            set_if = "$IcingaCheckHttpJsonResponse_Switchparameter_IgnoreSSL$"
        }
        "Warning" = {
            value = "$IcingaCheckHttpJsonResponse_Array_Warning$"
        }
        "Critical" = {
            value = "$IcingaCheckHttpJsonResponse_Array_Critical$"
        }
        "ValuePaths" = {
            value = "$IcingaCheckHttpJsonResponse_Array_ValuePaths$"
        }
        "StatusOnRequestError" = {
            value = "$IcingaCheckHttpJsonResponse_String_StatusOnRequestError$"
        }
        "FilePath" = {
            value = "$IcingaCheckHttpJsonResponse_String_FilePath$"
        }
        "NegateStringResults" = {
            set_if = "$IcingaCheckHttpJsonResponse_Switchparameter_NegateStringResults$"
        }
        "Verbosity" = {
            value = "$IcingaCheckHttpJsonResponse_Int32_Verbosity$"
        }
        "ServerUri" = {
            value = "$IcingaCheckHttpJsonResponse_String_ServerUri$"
        }
    }
    vars.ifw_api_command = "invoke-icingacheckhttpjsonresponse"
    vars.IcingaCheckHttpJsonResponse_Switchparameter_IgnoreSSL = false
    vars.IcingaCheckHttpJsonResponse_Switchparameter_NoPerfData = false
}
